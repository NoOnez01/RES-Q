<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <script type="text/javascript">
      // Applies the .dark class before first paint so there's no flash of
      // the wrong theme while React/Zustand hydrate -- kept in sync with
      // the 'theme' field ThemeBridge.tsx manages once the app is running.
      ;(function () {
        try {
          var raw = localStorage.getItem('resq-storage')
          var theme = raw ? JSON.parse(raw).state.theme : 'system'
          var dark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="theme-color" content="#0B6EBD" />
    <meta name="description" content="ResQ — ระบบประสานงานช่วยเหลือทางการแพทย์ฉุกเฉิน" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Noto+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>ResQ — ระบบจัดการอุบัติเหตุฉุกเฉินแบบครบวงจร</title>
    <script type="text/javascript">
      // Decodes the path 404.html re-encoded, restoring the real URL before
      // React Router mounts. See public/404.html for the other half.
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
